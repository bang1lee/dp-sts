<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Expansion | Ambient Lab</title><link rel="stylesheet" href="/src/expansion-film.css"></head><body><main><header><a href="/workbench.html">Ambient Lab</a><span>30초 연구 샘플</span></header><div class="intro"><p>GEOMETRY STUDY · 00:30</p><h1>Expansion</h1><p>규칙적인 박자를 따라 원들이 깊이와 잔향을 남기며 커집니다.</p></div><section class="stage"><canvas id="film" width="960" height="540" aria-label="박자에 맞춰 겹겹이 확장되는 입체 원형 구조"></canvas></section><section class="transport"><div class="actions"><button id="prepare" class="primary">소리 준비</button><button id="play" disabled>▶ 재생</button><button id="save-image">현재 장면 PNG</button><button id="save-wav" disabled>소리 WAV</button><button id="save-manifest">작품 정보 JSON</button></div><label for="seek">재생 위치 <output id="clock">00:00 / 00:30</output></label><input id="seek" type="range" min="0" max="30" step="0.01" value="0"><p id="status" role="status" aria-live="polite">소리를 준비한 뒤 재생하거나 위치를 이동해 장면을 살펴보세요.</p><div class="export"><button id="export-fixed" disabled>30fps 영상 · IVF</button><button id="cancel" hidden>취소</button><progress id="progress" max="1" value="0" hidden></progress><output id="percent"></output></div><p class="fine">30초, 900프레임, 960×540 무음 IVF입니다. WAV와 결합하면 같은 시간축으로 재생됩니다.</p></section><footer><a href="/workbench.html">작업실로 돌아가기</a></footer></main><script type="module" src="/src/expansion-film.ts"></script></body></html>
