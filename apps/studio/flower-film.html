<body><main><header><a href="/workbench.html">Ambient Lab</a><span>형태와 소리의 실험</span></header><div class="intro"><p>GEOMETRY STUDY · 01:29</p><h1>Flower of Life</h1><p>하나의 원에서 시작해 선이 만나는 순간마다 작은 장작 소리가 납니다.</p></div><section class="stage"><canvas id="film" width="960" height="540" aria-label="생명의 씨앗에서 생명의 꽃으로 자라는 원 도형"></canvas></section>
<section class="transport"><div class="actions"><button id="prepare" class="primary">소리 준비</button><button id="play" disabled>▶ 재생</button><button id="save-image">현재 장면 PNG</button><button id="save-wav" disabled>소리 WAV</button><button id="save-events">교차 이벤트 JSON</button><button id="save-manifest" disabled>작품 정보 JSON</button></div><label for="seek">재생 위치 <output id="clock">00:00 / 01:29</output></label><input id="seek" type="range" min="0" max="89.4332732399575" step="0.01" value="0"><p id="status" role="status" aria-live="polite">소리를 준비한 뒤 재생하거나 위치를 이동해 장면을 살펴보세요.</p><div class="export"><label for="export-size">영상 크기</label><select id="export-size"><option value="960x540">960 × 540</option><option value="1920x1080">1920 × 1080</option></select><button id="export-fixed" disabled>30fps 영상 · IVF</button><button id="cancel" hidden>취소</button><progress id="progress" max="1" value="0" hidden></progress><output id="percent"></output></div><p class="fine">IVF는 무음 영상입니다. WAV와 결합하면 같은 시간축으로 재생됩니다.</p></section><footer><a href="/workbench.html">작업실로 돌아가기</a></footer></main><script type="module" src="/src/flower-film.ts"></script></body></html>
